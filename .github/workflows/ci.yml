# cargo build/test/clippy, then the Durable Streams protocol conformance suite
# across the supported run configurations.
#
# Ported from electric-sql/electric's `server_rust_tests.yml`. Differences:
#   - paths are repo-relative (this repo IS the package, not a monorepo member)
#   - bun, not pnpm (pgxsinkit standard)
#   - the toolchain comes from rust-toolchain.toml rather than floating `stable`
#   - ubuntu-latest, not the blacksmith runners upstream used
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    name: cargo build + test + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Honours rust-toolchain.toml (pinned 1.96.0) — one source of truth for the
      # version, shared with the Dockerfile and with electric-circuits.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings

      # The admin scripts' tests start a local store from the binary built above.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Script tests
        env:
          RUST_SERVER_BIN: target/release/durable-streams-server
        run: bun run test:scripts

      - name: Upload server binaries
        uses: actions/upload-artifact@v4
        with:
          name: durable-streams-server
          path: |
            target/release/durable-streams-server
            target/release/durable-streams-access
          retention-days: 1

  # The release image builds with `telemetry` (see the Dockerfile), and the default
  # build above never compiles that code.
  telemetry:
    name: cargo test + clippy (telemetry)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Test
        run: cargo test --release --locked --features telemetry

      - name: Clippy
        run: cargo clippy --release --locked --all-targets --features telemetry -- -D warnings

  # The release image builds with `tier` too, and no other job compiles it. This one
  # tests and lints it, checks the S3 adapter against a local S3 (moto's server, from
  # PyPI: MinIO's images are no longer on Docker Hub), and runs the conformance suite
  # with `--tier s3` on that bucket. Segments are 4 KiB here so the suite's streams
  # seal, offload and read back from the bucket (the 8 MiB default would leave every
  # stream local).
  tier:
    name: tier (S3 adapter + conformance against a local S3)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MOTO_VERSION: 5.2.5
      DS_S3_BUCKET: ds-tier-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Build
        run: cargo build --release --locked --features tier

      - name: Test
        run: cargo test --release --locked --features tier

      - name: Clippy
        run: cargo clippy --release --locked --all-targets --features tier -- -D warnings

      - name: Start a local S3
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet "moto[server]==$MOTO_VERSION"
          nohup "$RUNNER_TEMP/moto/bin/moto_server" -H 127.0.0.1 -p 9000 > "$RUNNER_TEMP/moto.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9000/moto-api/ && break
            sleep 1
          done
          aws --endpoint-url http://127.0.0.1:9000 s3 mb "s3://$DS_S3_BUCKET"

      - name: S3 adapter against the local S3
        env:
          DS_S3_ACCESS_KEY_ID: test
          DS_S3_SECRET_ACCESS_KEY: test
        run: |
          cargo test --release --locked --features tier s3_minio_roundtrip -- --ignored
          cargo test --release --locked --features tier --test cli_durability_guards delete_mode_removes_an_expired_tiered_stream -- --ignored
          cargo test --release --locked --features tier --test cli_durability_guards idle_pass_moves_an_idle_stream_to_the_bucket -- --ignored

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run conformance (tier-s3)
        env:
          DS_S3_ACCESS_KEY_ID: test
          DS_S3_SECRET_ACCESS_KEY: test
          RUST_SERVER_ARGS: >-
            --tier s3 --tier-endpoint http://127.0.0.1:9000 --tier-region us-east-1
            --tier-bucket ds-tier-ci --tier-key-prefix conformance/ --tier-allow-http
            --tier-segment-bytes 4096
        run: bun run test:conformance

      # Once more with every stream moving by idle time: a stream unwritten for a
      # second is moved to the bucket whole, and the suite's later reads and
      # appends run against streams already in S3.
      - name: Run conformance (tier-s3, idle pass)
        env:
          DS_S3_ACCESS_KEY_ID: test
          DS_S3_SECRET_ACCESS_KEY: test
          RUST_SERVER_ARGS: >-
            --tier s3 --tier-endpoint http://127.0.0.1:9000 --tier-region us-east-1
            --tier-bucket ds-tier-ci --tier-key-prefix conformance-idle/ --tier-allow-http
            --tier-segment-bytes 4096 --tier-after-idle-secs 1 --tier-idle-move-rate 1000
        run: bun run test:conformance

      - name: Objects the conformance run offloaded
        if: always()
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for prefix in conformance/ conformance-idle/; do
            echo "$prefix"
            aws --endpoint-url http://127.0.0.1:9000 s3 ls --recursive --summarize "s3://$DS_S3_BUCKET/$prefix" | tail -3
          done

      - name: Local S3 log
        if: failure()
        run: tail -50 "$RUNNER_TEMP/moto.log" || true

  conformance:
    name: conformance (${{ matrix.config.name }})
    needs: cargo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the run-configuration matrix in the README.
        config:
          - { name: wal-default, args: '' }
          - { name: wal-resident-cache, args: '--tail-cache-bytes 65536' }
          - { name: wal-read-offload-always, args: '--read-offload always' }
          - { name: memory, args: '--durability memory' }
          - { name: wal-small-chunk, args: '--max-chunk-bytes 4096' }
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: durable-streams-server
          path: target/release

      - name: Make binary executable
        run: chmod +x target/release/durable-streams-server

      - name: Run conformance (${{ matrix.config.name }})
        env:
          RUST_SERVER_ARGS: ${{ matrix.config.args }}
        run: bun run test:conformance
